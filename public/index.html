<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14101F">
  <title>Romantasy</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/Cinzel-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/CormorantGaramond-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/verif-serveur.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Icônes : symboles SVG dessinés pour le projet (remplacement par game-icons.net prévu en phase 7). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-epee" viewBox="0 0 24 24">
      <path d="M12 1 15.2 12.8H8.8z"/>
      <rect x="4.5" y="12.8" width="15" height="3" rx="1.5"/>
      <rect x="10.4" y="15.8" width="3.2" height="4.9" rx="0.8"/>
      <circle cx="12" cy="22" r="1.7"/>
    </symbol>
    <symbol id="i-etoile" viewBox="0 0 24 24">
      <path d="M12 1.8l3.05 6.6 7.2.85-5.3 4.95 1.4 7.1L12 17.7l-6.35 3.6 1.4-7.1-5.3-4.95 7.2-.85z"/>
    </symbol>
    <symbol id="i-bouclier" viewBox="0 0 24 24">
      <path d="M12 1.8l8.2 3v6.6c0 5.1-3.5 8.7-8.2 10.8-4.7-2.1-8.2-5.7-8.2-10.8V4.8z"/>
    </symbol>
    <symbol id="i-retour" viewBox="0 0 24 24">
      <path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-coche" viewBox="0 0 24 24">
      <path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-lueur" viewBox="0 0 24 24">
      <path d="M12 1.5l2.2 8.3 8.3 2.2-8.3 2.2L12 22.5l-2.2-8.3L1.5 12l8.3-2.2z"/>
    </symbol>
  </svg>

  <div class="etincelles" aria-hidden="true"></div>

  <div class="page">
    <header class="entete">
      <div id="entete-gauche" class="entete-gauche"></div>
      <button id="reglage-animations" class="bouton-reglage" type="button" aria-pressed="false">
        <svg class="icone" aria-hidden="true" focusable="false"><use href="#i-lueur"/></svg>
        <span>Réduire les animations</span>
      </button>
    </header>
    <main id="ecran" class="ecran-zone" tabindex="-1"></main>
  </div>

  <noscript>
    <p class="noscript">Ce jeu a besoin de JavaScript pour fonctionner.</p>
  </noscript>
</body>
</html>
