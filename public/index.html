<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060B1E">
  <title>Romantasy</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/verif-serveur.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="ciel">
  <!-- Icônes et ornements : symboles SVG dessinés pour le projet, au trait fin de 1,5 px. L'épée, l'étoile et le bouclier
       sont des images de la propriétaire (img/epee.webp, img/etoile.webp, img/bouclier.webp, phase 7), posées par icone()
       dans js/dom.js. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-retour" viewBox="0 0 24 24">
      <path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </symbol>
    <symbol id="i-coche" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </symbol>
    <symbol id="i-lueur" viewBox="0 0 24 24">
      <path d="M12 2.5Q13 11 21.5 12Q13 13 12 21.5Q11 13 2.5 12Q11 11 12 2.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </symbol>
    <!-- Étincelle à 4 branches et séparateur filigrane (charte, section 5) -->
    <symbol id="i-etincelle" viewBox="0 0 10 10">
      <path d="M5 0Q5.5 4.5 10 5Q5.5 5.5 5 10Q4.5 5.5 0 5Q4.5 4.5 5 0Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-filigrane" viewBox="0 0 150 12">
      <path d="M4 6C30 6 40 1 62 6M88 6C110 11 120 6 146 6" fill="none" stroke="currentColor"/>
      <path d="M75 0Q76 5 81 6Q76 7 75 12Q74 7 69 6Q74 5 75 0Z" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="page">
    <header class="entete">
      <div id="ciel-entete" class="ciel-entete" aria-hidden="true"></div>
      <div id="entete-gauche" class="entete-gauche"></div>
      <img class="logo-compact" src="img/logo.webp" alt="Romantasy" width="52" height="52">
    </header>
    <main id="ecran" class="ecran-zone" tabindex="-1"></main>
    <!-- Phase 8 : annonce aux lecteurs d'écran des changements de vue de la partie en réseau (invisible à l'écran). -->
    <p id="annonce" class="annonce" aria-live="polite"></p>
  </div>

  <!-- Grain : un seul calque, non interactif, 1 octave (charte, section 8) -->
  <svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>

  <noscript>
    <p class="noscript">Ce jeu a besoin de JavaScript pour fonctionner.</p>
  </noscript>
</body>
</html>
