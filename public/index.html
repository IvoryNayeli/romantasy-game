<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060B1E">
  <title>Romantasy</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/verif-serveur.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="ciel">
  <!-- Icônes et ornements : symboles SVG dessinés pour le projet, au trait fin de 1,5 px (sauf le bouclier et le sort jeté,
       formes pleines demandées par la propriétaire). Remplacement des icônes par game-icons.net prévu en phase 8. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-epee" viewBox="0 0 24 24">
      <path d="M12 2.5 14 14H10Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <path d="M6.5 14h11M12 14v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="12" cy="20.8" r="1.2" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    </symbol>
    <symbol id="i-etoile" viewBox="0 0 24 24">
      <path d="M12 2.8l2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17l-5.6 3.1 1.2-6.3L3 9.4l6.3-.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </symbol>
    <!-- Bouclier plein (boutons) : forme pleine en currentColor, étincelle évidée au centre. Écart volontaire à la charte
         (icônes au trait fin), demandé par la propriétaire : voir docs/PROJET.md. -->
    <symbol id="i-bouclier" viewBox="0 0 24 24">
      <path d="M12 1.8 21 5.2v7c0 5.4-3.8 9.2-9 11-5.2-1.8-9-5.6-9-11v-7ZM12 7.2Q12.9 11.1 16.8 12Q12.9 12.9 12 16.8Q11.1 12.9 7.2 12Q11.1 11.1 12 7.2Z" fill="currentColor" fill-rule="evenodd"/>
    </symbol>
    <!-- Grand bouclier de l'écran de transition : formes pleines, ambre (bord) et braise (face), étincelle clair de lune -->
    <symbol id="i-bouclier-grand" viewBox="0 0 100 100">
      <path d="M50 3 91 18V50C91 77 73 91 50 98 27 91 9 77 9 50V18Z" style="fill:var(--c-ambre)"/>
      <path d="M50 14 80 25V50C80 69 67 80 50 87 33 80 20 69 20 50V25Z" style="fill:var(--c-braise);stroke:var(--c-nuit)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 29Q53.6 46.4 71 50Q53.6 53.6 50 71Q46.4 53.6 29 50Q46.4 46.4 50 29Z" style="fill:var(--c-etoile)"/>
    </symbol>
    <!-- Sort jeté (écran de transition) : étoile à cinq branches régulière, pleine, ambre (rayon 48, centrée dans 100 x 100) -->
    <symbol id="i-sort-jete" viewBox="0 0 100 100">
      <path d="M50 6.6 60.77 39.77 95.65 39.77 67.43 60.26 78.21 93.43 50 72.93 21.79 93.43 32.57 60.26 4.35 39.77 39.23 39.77Z" style="fill:var(--c-ambre)"/>
    </symbol>
    <symbol id="i-retour" viewBox="0 0 24 24">
      <path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </symbol>
    <symbol id="i-coche" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </symbol>
    <symbol id="i-lueur" viewBox="0 0 24 24">
      <path d="M12 2.5Q13 11 21.5 12Q13 13 12 21.5Q11 13 2.5 12Q11 11 12 2.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </symbol>
    <!-- Étincelle à 4 branches et séparateur filigrane (charte, section 5) -->
    <symbol id="i-etincelle" viewBox="0 0 10 10">
      <path d="M5 0Q5.5 4.5 10 5Q5.5 5.5 5 10Q4.5 5.5 0 5Q4.5 4.5 5 0Z" fill="currentColor"/>
    </symbol>
    <symbol id="i-filigrane" viewBox="0 0 150 12">
      <path d="M4 6C30 6 40 1 62 6M88 6C110 11 120 6 146 6" fill="none" stroke="currentColor"/>
      <path d="M75 0Q76 5 81 6Q76 7 75 12Q74 7 69 6Q74 5 75 0Z" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="page">
    <header class="entete">
      <div id="ciel-entete" class="ciel-entete" aria-hidden="true"></div>
      <div id="entete-gauche" class="entete-gauche"></div>
      <img class="logo-compact" src="img/logo.webp" alt="Romantasy" width="40" height="40">
    </header>
    <main id="ecran" class="ecran-zone" tabindex="-1"></main>
  </div>

  <!-- Grain : un seul calque, non interactif, 1 octave (charte, section 8) -->
  <svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>

  <noscript>
    <p class="noscript">Ce jeu a besoin de JavaScript pour fonctionner.</p>
  </noscript>
</body>
</html>
